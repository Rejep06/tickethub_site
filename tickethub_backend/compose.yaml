name: tickethub
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tickethub}
      POSTGRES_USER: ${POSTGRES_USER:-tickethub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/create_local_env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim-bookworm}
        REQUIREMENTS_FILE: ${REQUIREMENTS_FILE:-requirements.txt}
    env_file: ${TICKETHUB_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready/', timeout=5)"]
      interval: 15s
      timeout: 7s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
