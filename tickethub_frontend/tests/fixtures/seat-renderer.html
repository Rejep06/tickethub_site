<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tickethub — проверка рендера карты</title>
<link rel="stylesheet" href="/src/styles/tokens.css"><link rel="stylesheet" href="/src/styles/foundation.css"><link rel="stylesheet" href="/src/styles/experience.css"><link rel="stylesheet" href="/src/styles/usability-update.css">
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui;background:var(--page);color:var(--ink)}main{max-width:1200px;margin:30px auto;padding:0 20px}h1{font-size:32px;margin:10px 0}p{color:var(--secondary)}.preview-label{font-size:11px;letter-spacing:.07em}.note{font-size:12px}.fixture-controls{display:flex;gap:10px;margin:20px 0}button{cursor:pointer}.seat-viewport{height:600px}.seat-image-plane{background:white}.field select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}.hovercard{position:absolute;background:var(--surface);box-shadow:0 10px 35px #0002;bottom:20px;left:20px;padding:20px;border-radius:14px;border:1px solid var(--line)}@media(max-width:650px){main{margin:20px auto;padding:0 12px}h1{font-size:24px}.seat-viewport{height:440px}}
</style></head><body><main>
<div class="preview-label">TICKETHUB / ТЕСТ РЕНДЕРА</div><h1>Ближе к своему месту</h1><p>Изолированный Canvas-рендер из исходников. Геометрия и наличие — тестовые, не афиша.</p>
<div class="fixture-controls"><label class="field">Сектор<select id="sector"><option value="">Вся арена</option><option>A101</option><option>A102</option><option>A103</option><option>A104</option></select></label><button class="btn btn-secondary" id="theme">Тёмная / светлая</button></div>
<div class="seat-camera-wrap"><div class="seat-camera-toolbar"><span id="sector-name">Вся арена</span><div class="actions"><button class="btn btn-secondary" id="minus">−</button><output class="camera-zoom" id="scale">100%</output><button class="btn btn-secondary" id="plus">+</button><button class="btn btn-ghost" id="reset">Вся схема</button></div></div>
<div id="viewport" class="seat-viewport"><div id="plane" class="seat-image-plane"><svg width="1000" height="625" viewBox="0 0 1000 625" aria-hidden="true"><rect x="230" y="218" width="540" height="190" rx="60" fill="#f7fcfd" stroke="#d6dee3"/><path d="M500 218v190 M420 218v190 M580 218v190" stroke="#a6bbc9"/><circle cx="500" cy="313" r="34" fill="none" stroke="#c2d7dd"/><circle cx="330" cy="268" r="23" fill="none" stroke="#dfb6b6"/><circle cx="670" cy="268" r="23" fill="none" stroke="#dfb6b6"/><circle cx="330" cy="357" r="23" fill="none" stroke="#dfb6b6"/><circle cx="670" cy="357" r="23" fill="none" stroke="#dfb6b6"/><text x="500" y="319" text-anchor="middle" fill="#8197a3" style="font:11px system-ui;letter-spacing:2px">ТЕСТОВАЯ АРЕНА</text></svg></div><canvas id="canvas" class="seat-points-canvas"></canvas><div id="chosen" class="hovercard" hidden></div></div>
<div class="map-gesture-hint"><span>Сектор → увеличение → конкретное место</span><span>Тестовые места не бронируются</span></div></div><p class="note">Проверка рендера, не снимок запущенного Next.js или интеграции с Django.</p></main>
<script type="module">
import * as M from './seat-viewport.js';
const model=M.buildSeatModel(Array.from({length:4*16*32},(_,i)=>{const sector=Math.floor(i/512),r=Math.floor(i%512/32),n=i%32;return {id:String(i),sector:'A10'+(sector+1),row:String(r+1),number:String(n+1),x:.17+(sector%2)*.40+n*.008,y:(sector<2?.10:.72)+r*.007};}));
const available=new Set(model.seats.filter((_,i)=>i%3!==0).map(s=>s.seat.id)),selected=new Set();const v=document.querySelector('#viewport'),el=document.querySelector('#canvas'),ctx=el.getContext('2d');let size,camera,sector='',labels=[],drag=null;
function resize(){const old=size;size={width:v.clientWidth,height:v.clientHeight};camera=old?M.resizeCamera(camera,old,size,model.world):M.fitCamera(model.world,size);draw();}
function draw(){const dpr=Math.min(devicePixelRatio,2);el.width=size.width*dpr;el.height=size.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);labels=M.drawSeatMap(ctx,model,camera,size,{available,selected,sector});document.querySelector('#plane').style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.scale})`;document.querySelector('#scale').value=Math.round(camera.scale/M.fitCamera(model.world,size).scale*100)+'%';window.testState={camera,size,selected:[...selected],seats:model.seats.length,labels};}
function focus(name){sector=name;document.querySelector('#sector').value=name;document.querySelector('#sector-name').textContent=name?'Сектор '+name:'Вся арена';camera=M.clampCamera(M.fitCamera(model.world,size,model.sectors.find(s=>s.name===name)?.bounds,name?60:24),model.world,size);document.querySelector('#chosen').hidden=true;draw();}
document.querySelector('#sector').onchange=e=>focus(e.target.value);document.querySelector('#reset').onclick=()=>focus('');const zoom=f=>{camera=M.zoomAt(camera,{x:size.width/2,y:size.height/2},f,model.world,size);draw();};document.querySelector('#plus').onclick=()=>zoom(1.5);document.querySelector('#minus').onclick=()=>zoom(1/1.5);document.querySelector('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';draw();};
const local=e=>{const b=v.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};};
el.addEventListener('wheel',e=>{e.preventDefault();camera=M.zoomAt(camera,local(e),Math.exp(-e.deltaY*.003),model.world,size);draw();},{passive:false});
el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);drag={at:local(e),camera,moved:false};};el.onpointermove=e=>{if(!drag)return;const at=local(e),dx=at.x-drag.at.x,dy=at.y-drag.at.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(drag.moved){camera=M.clampCamera({...drag.camera,x:drag.camera.x+dx,y:drag.camera.y+dy},model.world,size);draw();}};
el.onpointerup=e=>{if(!drag)return;const moved=drag.moved;drag=null;if(moved)return;const at=local(e),label=labels.find(l=>at.x>=l.x&&at.x<=l.x+l.width&&at.y>=l.y&&at.y<=l.y+l.height);if(label){focus(label.sector);return;}const s=M.nearestSeat(model,at,camera,24,sector);if(!s)return;if(!M.canInspectSeat(s,camera)){focus(s.seat.sector);return;}if(available.has(s.seat.id)){if(selected.has(s.seat.id))selected.delete(s.seat.id);else selected.add(s.seat.id);}const panel=document.querySelector('#chosen');panel.hidden=false;panel.textContent=`Сектор ${s.seat.sector} · Ряд ${s.seat.row} · Место ${s.seat.number}`;draw();};
new ResizeObserver(resize).observe(v);window.harness={focus,zoom,model,M,get camera(){return camera;}};resize();
</script></body></html>
